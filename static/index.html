<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 求职数字分身 - 演示站</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  min-height: 100vh;
  overflow: hidden;
}
#app {
  display: flex;
  height: 100vh;
  max-width: 1100px;
  margin: 0 auto;
  box-shadow: 0 0 60px rgba(0,0,0,0.3);
}
/* 左侧3D数字人 */
.avatar-section {
  flex: 0 0 430px;          /* 从 340px 加宽，给头像两侧的荣誉卡片留出更大空间 */
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at center, rgba(102,126,234,0.15) 0%, transparent 70%);
  perspective: 1000px;
  padding: 20px 0;
}
.avatar-3d-container {
  width: 140px;
  height: 182px;
  position: relative;
  transform-style: preserve-3d;
  animation: avatarFloat 4s ease-in-out infinite;
}
@keyframes avatarFloat {
  0%, 100% { transform: translateY(0) rotateY(-8deg) rotateX(2deg); }
  50% { transform: translateY(-12px) rotateY(8deg) rotateX(-2deg); }
}
.avatar-3d-container.speaking {
  animation: avatarSpeaking 0.8s ease-in-out infinite;
}
@keyframes avatarSpeaking {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6px) scale(1.03); }
}
.avatar-photo {
  width: 100%;
  height: 100%;
  border-radius: 12px;
  object-fit: cover;
  box-shadow: 
    0 0 0 6px #d4af37,
    0 0 0 8px #fff,
    0 20px 60px rgba(0,0,0,0.5),
    0 0 40px rgba(102,126,234,0.3);
  transform: translateZ(20px);
  transition: box-shadow 0.3s;
}
.avatar-3d-container.speaking .avatar-photo {
  box-shadow: 
    0 0 0 6px #d4af37,
    0 0 0 8px #fff,
    0 20px 60px rgba(0,0,0,0.5),
    0 0 60px rgba(102,126,234,0.8),
    0 0 100px rgba(102,126,234,0.4);
}
.avatar-photo-back {
  position: absolute;
  top: 10px;
  left: 10px;
  right: -10px;
  bottom: -10px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 12px;
  transform: translateZ(-10px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* ===== 荣誉卡片：头像左右各一个"区域"，各 5 张卡片散落在区域里 ===== */
.honor-region {
  position: absolute;
  top: 6%;
  bottom: 6%;
  /* 宽度跟着面板自动算：面板一半 − 给头像让位的 107px − 留边 16px。
     这样换任何屏幕宽度都不用改数字，区域永远是"贴着头像但不贴边"。 */
  width: calc(50% - 123px);
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;   /* 纵向自动等分，换屏幕高度也不用改坐标 */
  gap: 4px;
  z-index: 6;
  pointer-events: none;
}
/* 两个区域都紧靠头像两侧：以头像中线为锚点，往两边各让开 107px */
.honor-region-left  { right: 50%; margin-right: 107px; align-items: flex-start; }
.honor-region-right { left: 50%;  margin-left: 107px;  align-items: flex-end; }

.honor-card {
  width: 70px;
  height: 95px;
  display: block;
  border-radius: 7px;
  object-fit: cover;
  border: 2px solid rgba(212,175,55,0.75);
  box-shadow: 0 6px 22px rgba(0,0,0,0.45), 0 0 14px rgba(212,175,55,0.2);
  opacity: 0.94;
  background: #fff;
  cursor: pointer;
  pointer-events: auto;
  flex-shrink: 0;
  /* 倾斜由 --rot 控制、大小由 --sc 控制；hover 时摆正并放大 */
  transform: rotate(var(--rot, 0deg)) scale(var(--sc, 1));
  transition: transform 0.28s cubic-bezier(.34,1.56,.64,1), box-shadow 0.28s, opacity 0.28s;
}
/* 横版证书（数据看板、竞赛奖状）：卡片同样做成横版，整张图完整显示不裁切 */
.honor-card-wide {
  width: 96px;
  height: 70px;
  object-fit: contain;
}
/* 悬停时放大并摆正，放大到能看清证书上的字 */
.honor-card:hover {
  opacity: 1;
  transform: rotate(0deg) scale(1.7);
  box-shadow: 0 14px 44px rgba(0,0,0,0.6), 0 0 34px rgba(212,175,55,0.6);
  z-index: 30;
}

/* 左区域：每张卡的横向位置、大小、倾斜角都不同 —— 关键是别让它们连成一条直线。
   卡片变高后倾斜会明显加宽占位，所以角度比之前收小（±2~4°） */
.honor-region-left .honor-card:nth-child(1) { margin:  -8px 0 0 0;   --rot: -4deg; --sc: .97; animation: honorFloat 5.2s ease-in-out infinite 0s; }
.honor-region-left .honor-card:nth-child(2) { margin:  10px 0 0 18px; --rot:  3deg; --sc: .92; animation: honorFloat 5.9s ease-in-out infinite .5s; }
.honor-region-left .honor-card:nth-child(3) { margin:  -4px 0 0 6px;  --rot: -2deg; --sc: .96; animation: honorFloat 5.5s ease-in-out infinite 1.1s; }
.honor-region-left .honor-card:nth-child(4) { margin:   8px 0 0 22px; --rot:  4deg; --sc: .93; animation: honorFloat 6.2s ease-in-out infinite .8s; }
.honor-region-left .honor-card:nth-child(5) { margin: -10px 0 0 12px; --rot: -3deg; --sc: .95; animation: honorFloat 5.7s ease-in-out infinite 1.4s; }

/* 右区域：偏移刻意与左边不同，避免看出镜像规律 */
.honor-region-right .honor-card:nth-child(1) { margin:   8px 18px 0 0; --rot:  3deg; --sc: .96; animation: honorFloat 6.0s ease-in-out infinite .3s; }
.honor-region-right .honor-card:nth-child(2) { margin:  -8px  2px 0 0; --rot: -3deg; --sc: .93; animation: honorFloat 5.4s ease-in-out infinite .9s; }
.honor-region-right .honor-card:nth-child(3) { margin:  10px 22px 0 0; --rot:  4deg; --sc: .95; animation: honorFloat 6.3s ease-in-out infinite 1.5s; }
.honor-region-right .honor-card:nth-child(4) { margin:  -4px  6px 0 0; --rot: -4deg; --sc: .97; animation: honorFloat 5.6s ease-in-out infinite .1s; }
.honor-region-right .honor-card:nth-child(5) { margin:   6px 14px 0 0; --rot:  2deg; --sc: .92; animation: honorFloat 5.8s ease-in-out infinite 1.2s; }

/* 横版卡比竖版宽，横向能让的余地小，单独给更小的错位量（放在后面才能覆盖上面的规则） */
.honor-region-right .honor-card-wide:nth-child(1) { margin:   8px 0 0 0; --rot:  3deg; }
.honor-region-right .honor-card-wide:nth-child(4) { margin:  -4px 4px 0 0; --rot: -3deg; }

/* ===== 点开看大图：卡片再大也读不清证书上的字，点一下铺满屏幕 ===== */
#honorLightbox {
  position: fixed;
  inset: 0;
  z-index: 999;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(8, 8, 20, 0.86);
  cursor: zoom-out;
  padding: 4vh 4vw;
}
#honorLightbox.open { display: flex; }
#honorLightbox img {
  max-width: 92vw;
  max-height: 88vh;
  border-radius: 8px;
  border: 3px solid rgba(212,175,55,0.85);
  box-shadow: 0 24px 80px rgba(0,0,0,0.8), 0 0 60px rgba(212,175,55,0.35);
  background: #fff;
}
#honorLightbox .lb-hint {
  position: absolute;
  bottom: 2.5vh;
  left: 0; right: 0;
  text-align: center;
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  letter-spacing: 1px;
  pointer-events: none;
}

/* 用独立的 translate 属性做浮动，避免和 transform 里的 rotate 互相覆盖 */
@keyframes honorFloat {
  0%, 100% { translate: 0 0; }
  50%      { translate: 0 -7px; }
}

.honor-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 280px;
  height: 340px;
  background: radial-gradient(ellipse, rgba(212,175,55,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.avatar-name {
  color: #fff;
  font-size: 24px;
  font-weight: bold;
  margin-top: 8px;
  text-shadow: 0 2px 10px rgba(102,126,234,0.5);
}
.avatar-title {
  color: rgba(255,255,255,0.7);
  font-size: 14px;
  margin-top: 6px;
}
.status-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 6px 16px;
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  color: #4ade80;
  font-size: 13px;
}
.status-dot {
  width: 8px;
  height: 8px;
  background: #4ade80;
  border-radius: 50%;
  animation: blink 1.5s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
.status-dot.speaking { background: #fbbf24; animation: pulse 0.5s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }

/* 右侧聊天区 */
.chat-section {
  flex: 1;
  background: rgba(255,255,255,0.98);
  display: flex;
  flex-direction: column;
  box-shadow: -5px 0 30px rgba(0,0,0,0.3);
}
.chat-header {
  padding: 20px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
}
.chat-header h2 { font-size: 18px; }
.chat-header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: #f8f9fa;
}
.message {
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.message.user-msg { flex-direction: row-reverse; }
.msg-bubble {
  max-width: 75%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.8;
  word-wrap: break-word;
}
.avatar-msg .msg-bubble {
  background: #fff;
  border-bottom-left-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.user-msg .msg-bubble {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.typing { display:inline-flex; gap:4px; padding:4px 0; }
.typing span {
  width:8px; height:8px; background:#999; border-radius:50%;
  animation: typing 1.4s infinite;
}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes typing { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }

.quick-questions {
  padding: 10px 20px;
  background: #fff;
  border-top: 1px solid #eee;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.quick-btn {
  padding: 5px 12px;
  background: #f0f0f0;
  border: none;
  border-radius: 15px;
  font-size: 12px;
  color: #555;
  cursor: pointer;
  transition: all 0.2s;
}
.quick-btn:hover { background: #667eea; color: #fff; }
.input-area {
  padding: 16px 20px;
  background: #fff;
  border-top: 1px solid #eee;
  display: flex;
  gap: 10px;
}
.input-area input {
  flex: 1;
  padding: 10px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 20px;
  font-size: 16px;
  outline: none;
}
.input-area input:focus { border-color: #667eea; }
.input-area button {
  padding: 10px 20px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
}
.input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

/* 音频可视化条 */
.audio-bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 20px;
  margin-left: 8px;
}
.audio-bars span {
  width: 3px;
  background: #4ade80;
  border-radius: 2px;
  transition: height 0.05s;
}

/* 消息里的声音控制条 */
.voice-ctl {
  display: inline-block;
  margin-top: 10px;
  padding: 4px 10px;
  font-size: 12px;
  color: #667eea;
  background: rgba(102,126,234,0.07);
  border: 1px solid rgba(102,126,234,0.35);
  border-radius: 14px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.voice-ctl.primary {
  padding: 9px 18px;
  font-size: 13px;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(135deg,#667eea,#764ba2);
  border: none;
  border-radius: 20px;
  box-shadow: 0 2px 10px rgba(102,126,234,0.45);
}

/* 文字跟随语音：正在念到的那个字会亮起来 */
.sync-text .ch {
  border-radius: 3px;
  transition: background-color 0.12s, color 0.12s;
}
.sync-text .ch.spoken { color: #111827; }
.sync-text .ch.current {
  background: rgba(102,126,234,0.26);
  color: #1e1b4b;
  font-weight: 600;
}

@media (max-width: 900px) {
  body { overflow: auto; }
  #app { flex-direction: column; max-width: 100%; height: auto; min-height: 100vh; }
  .avatar-section { flex: none; height: auto; min-height: 440px; padding: 26px 10px; }
  .avatar-3d-container { width: 140px; height: 180px; }
  .avatar-name { font-size: 22px; margin-top: 8px; }
  .avatar-title { font-size: 12px; }
  /* 手机端：卡片按比例缩小；区域宽度是 calc(50% - 109px) 自动算的，不用改 */
  .honor-region { top: 3%; bottom: 3%; }
  .honor-card { width: 50px; height: 68px; border-width: 1.5px; }
  .honor-card-wide { width: 68px; height: 50px; }
  .honor-card:hover { transform: rotate(0deg) scale(1.25); }
  .chat-section { width: 100%; flex: 1; min-height: 50vh; }
  .chat-header { padding: 15px; }
  .chat-header h2 { font-size: 16px; }
  .chat-area { padding: 15px; }
  .quick-btn { font-size: 12px; padding: 6px 10px; }
}
/* 更窄的小屏（≤400px）再缩一档，否则卡片会顶到屏幕边 */
@media (max-width: 400px) {
  .honor-card { width: 44px; height: 60px; }
  .honor-card-wide { width: 60px; height: 44px; }
}
/* 矮屏幕（笔记本常见 768/900 高，浏览器可视区只有 650~780）：
   5 张竖排会超出面板高度，按高度再缩一档 */
@media (min-width: 901px) and (max-height: 780px) {
  .honor-region { top: 4%; bottom: 4%; gap: 2px; }
  .honor-card { width: 58px; height: 79px; }
  .honor-card-wide { width: 80px; height: 58px; }
}
</style>
<body>
<div id="app">
  <div class="avatar-section">
    <div class="avatar-3d-container" id="avatar3d" style="width:150px;height:195px;">
      <div class="honor-glow"></div>
      <div class="avatar-photo-back"></div>
      <img class="avatar-photo" src="assets/th/avatar.webp" alt="数字分身形象" decoding="async" fetchpriority="high">
    </div>

    <!-- 头像左侧区域：5 张卡片散落在这个区域里 -->
    <!-- 卡片只加载 th/ 里的缩略图（几十 KB）；点开时才去取 lg/ 大图 -->
    <div class="honor-region honor-region-left">
      <img class="honor-card" src="assets/th/award.webp" data-full="assets/lg/award.webp" alt="获奖证书" title="获奖证书 · 示例" decoding="async">
      <img class="honor-card" src="assets/th/paper.webp" data-full="assets/lg/paper.webp" alt="学术论文" title="学术论文首页 · 示例" decoding="async">
      <img class="honor-card" src="assets/th/patent.webp" data-full="assets/lg/patent.webp" alt="专利受理" title="专利申请受理 · 示例" decoding="async">
      <img class="honor-card" src="assets/th/scholarship.webp" data-full="assets/lg/scholarship.webp" alt="奖学金证书" title="学业奖学金 · 示例" decoding="async">
      <img class="honor-card" src="assets/th/cet.webp" data-full="assets/lg/cet.webp" alt="英语证书" title="大学英语六级 · 示例" decoding="async">
    </div>

    <!-- 头像右侧区域：5 张卡片散落在这个区域里 -->
    <div class="honor-region honor-region-right">
      <img class="honor-card honor-card-wide" src="assets/th/dashboard.webp" data-full="assets/lg/dashboard.webp" alt="数据看板" title="数据看板 · 示例" decoding="async">
      <img class="honor-card" src="assets/th/project.webp" data-full="assets/lg/project.webp" alt="项目结项" title="项目结项证明 · 示例" decoding="async">
      <img class="honor-card" src="assets/th/intern.webp" data-full="assets/lg/intern.webp" alt="实习证明" title="实习实践证明 · 示例" decoding="async">
      <img class="honor-card honor-card-wide" src="assets/th/contest.webp" data-full="assets/lg/contest.webp" alt="竞赛获奖" title="数据分析竞赛 · 示例" decoding="async">
      <img class="honor-card" src="assets/th/skill.webp" data-full="assets/lg/skill.webp" alt="技能认证" title="数据分析技能认证 · 示例" decoding="async">
    </div>
    <div class="avatar-name">林小舟</div>
    <div class="avatar-title">计算机科学与技术 · 2027届毕业生</div>
    <div class="status-indicator">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">在线，随时为你解答</span>
      <div class="audio-bars" id="audioBars" style="display:none">
        <span style="height:30%"></span><span style="height:60%"></span><span style="height:40%"></span>
        <span style="height:80%"></span><span style="height:50%"></span>
      </div>
    </div>
  </div>
  
  <div class="chat-section">
    <div class="chat-header">
      <h2>林小舟的AI求职数字分身</h2>
      <p>云溪大学 · 计算机科学与技术 · 简历上的任何事都可以问我</p>
    </div>
    <div class="chat-area" id="chatArea">
      <div class="message avatar-msg">
        <div class="msg-bubble">你好，我是林小舟的数字分身。<br><br>他这会儿多半在准备面试，就先由我来接待你。<br><br>关于他的教育背景、科研项目、实习经历、技能特长，你都可以问我，我会用他本人的声音回答你。</div>
      </div>
    </div>
    <div class="quick-questions">
      <button class="quick-btn" onclick="askQuestion('自我介绍')">自我介绍</button>
      <button class="quick-btn" onclick="askQuestion('教育背景')">教育背景</button>
      <button class="quick-btn" onclick="askQuestion('科研项目')">科研项目</button>
      <button class="quick-btn" onclick="askQuestion('实习经历')">实习经历</button>
      <button class="quick-btn" onclick="askQuestion('技能特长')">技能特长</button>
      <button class="quick-btn" onclick="askQuestion('获奖成果')">获奖成果</button>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="输入你的问题..." onkeypress="if(event.key==='Enter')sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<!-- 常驻音频元素：整个页面只用一个，第一次触摸时被"点亮"，之后就能自动播放 -->
<audio id="voicePlayer" preload="auto" style="display:none"></audio>

<script>
// ============================================================
// 移动端自动播放方案说明
// ------------------------------------------------------------
// 手机浏览器（iOS Safari / 安卓 Chrome / 微信内置浏览器）规定：
// 音频只能"在用户手势的同步调用栈里"开始播放。
// 之前的写法是 await fetch('/api/tts') 之后再 new Audio().play()，
// 经过网络等待后手势上下文已经失效 -> 被系统拦截 -> 没声音，只能手动点按钮。
//
// 现在的做法：
// 1) 页面里常驻一个 <audio> 元素和一个 AudioContext；
// 2) 在用户第一次触摸/点击时（点"发送"或快捷问题那一下），
//    立即用静音音频把这套音频通道"点亮"（解锁）；
// 3) 之后 TTS 合成好，直接自动播放，无需再点任何按钮。
// ============================================================

const AUDIO = {
  ctx: null,          // 常驻 AudioContext
  analyser: null,     // 频谱分析（驱动口型动画条）
  data: null,
  el: null,           // 常驻 <audio> 元素
  src: null,          // 当前播放中的 AudioBufferSourceNode
  elActive: false,
  playing: false,
  token: 0,           // 播放令牌：防止上一条的音频打断新一条
  silentUrl: null
};

// ---------- 音频通道解锁 ----------
function getAudioEl() {
  if (!AUDIO.el) AUDIO.el = document.getElementById('voicePlayer');
  return AUDIO.el;
}

// 用 Blob 现场生成一小段静音 WAV（不依赖外链、不依赖静态资源）
function makeSilentWav() {
  const sr = 8000, n = 800;                       // 0.1 秒静音
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  function str(off, s) { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); }
  str(0, 'RIFF');  v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true);  v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

function unlockAudio() {
  if (AUDIO.playing) return;   // 正在播真声音时不要去动通道

  // 通道 1：Web Audio（移动端成功率最高）
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) {
      if (!AUDIO.ctx) {
        AUDIO.ctx = new AC();
        AUDIO.analyser = AUDIO.ctx.createAnalyser();
        AUDIO.analyser.fftSize = 256;
        AUDIO.analyser.connect(AUDIO.ctx.destination);
        AUDIO.data = new Uint8Array(AUDIO.analyser.frequencyBinCount);
      }
      if (AUDIO.ctx.state !== 'running') AUDIO.ctx.resume();
      if (AUDIO.ctx.state === 'running') {
        // 播一个 1 帧的静音 buffer，把上下文彻底激活
        const b = AUDIO.ctx.createBuffer(1, 1, 22050);
        const s = AUDIO.ctx.createBufferSource();
        s.buffer = b; s.connect(AUDIO.ctx.destination); s.start(0);
      }
    }
  } catch (e) { /* 忽略 */ }

  // 通道 2：常驻 <audio> 元素（部分安卓 / 微信 WebView 只认这条路）
  try {
    const el = getAudioEl();
    if (el && el.dataset.unlocked !== '1') {
      if (!AUDIO.silentUrl) AUDIO.silentUrl = makeSilentWav();
      el.src = AUDIO.silentUrl;
      el.volume = 0;
      const p = el.play();
      if (p && p.then) {
        p.then(function () {
          el.dataset.unlocked = '1';
          try { el.pause(); } catch (e) {}
          el.volume = 1;
        }).catch(function () { /* 下一轮手势再试 */ });
      }
    }
  } catch (e) { /* 忽略 */ }
}

// 尽早绑上所有可能的手势事件（capture 阶段，保证先于业务逻辑执行）
(function bindUnlock() {
  const evs = ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'click', 'keydown'];
  for (let i = 0; i < evs.length; i++) {
    document.addEventListener(evs[i], unlockAudio, { capture: true, passive: true });
  }
  // 微信内置浏览器：这个事件后允许自动播放
  document.addEventListener('WeixinJSBridgeReady', unlockAudio, false);
  if (window.WeixinJSBridge) setTimeout(unlockAudio, 0);
  // 从后台切回来时 AudioContext 可能被挂起，尝试恢复
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && AUDIO.ctx && AUDIO.ctx.state !== 'running') {
      try { AUDIO.ctx.resume(); } catch (e) {}
    }
  });
})();

// ---------- 3D 数字人状态 ----------
let isSpeaking = false;

function setSpeaking(speaking, label) {
  isSpeaking = speaking;
  // 注意：这些元素全部做空值保护。
  // 之前有人改版式时把 statusDot / audioBars 删掉了，这里直接抛异常，
  // 把整条播放链路带崩 —— 表现就是"完全没有声音"，很难查。改版时别再踩。
  const avatar = document.getElementById('avatar3d');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const audioBars = document.getElementById('audioBars');

  if (avatar) avatar.classList[speaking ? 'add' : 'remove']('speaking');
  if (statusDot) statusDot.classList[speaking ? 'add' : 'remove']('speaking');
  if (statusText) statusText.textContent = speaking ? (label || '正在回答...') : '在线，随时为你解答';
  if (audioBars) audioBars.style.display = speaking ? 'flex' : 'none';
}

// ---------- 音频可视化条 ----------
let barsRAF = null;

function animateBarsReal() {
  if (!AUDIO.analyser) return;
  AUDIO.analyser.getByteFrequencyData(AUDIO.data);
  const bars = document.querySelectorAll('#audioBars span');
  for (let i = 0; i < bars.length; i++) {
    bars[i].style.height = (22 + (AUDIO.data[(i + 1) * 7] / 255) * 72) + '%';
  }
  barsRAF = requestAnimationFrame(animateBarsReal);
}

function animateBarsFake() {
  const bars = document.querySelectorAll('#audioBars span');
  for (let i = 0; i < bars.length; i++) {
    bars[i].style.height = (28 + Math.random() * 66) + '%';
  }
  barsRAF = requestAnimationFrame(animateBarsFake);
}

function startBars(real) {
  stopBars();
  const el = document.getElementById('audioBars');
  if (!el) return;                       // 元素被删掉也不要影响播放
  el.style.display = 'flex';
  if (real) animateBarsReal(); else animateBarsFake();
}

function stopBars() {
  if (barsRAF) { cancelAnimationFrame(barsRAF); barsRAF = null; }
}

// ---------- 音频解码 ----------
function decodeAudioBuffer(arrayBuffer) {
  return new Promise(function (resolve, reject) {
    if (!AUDIO.ctx) { reject(new Error('音频上下文未初始化')); return; }
    let ret;
    try {
      ret = AUDIO.ctx.decodeAudioData(arrayBuffer, resolve, reject);   // 兼容老版 Safari
    } catch (e) { reject(e); return; }
    if (ret && ret.then) ret.then(resolve, reject);
  });
}

function stopPlayback() {
  clearSync();
  if (AUDIO.src) {
    try { AUDIO.src.onended = null; AUDIO.src.stop(0); } catch (e) {}
    AUDIO.src = null;
  }
  if (AUDIO.elActive && AUDIO.el) {
    try { AUDIO.el.pause(); } catch (e) {}
    AUDIO.elActive = false;
  }
  AUDIO.playing = false;
}

// ---------- 聊天逻辑 ----------
function addMessage(text, isUser) {
  const chatArea = document.getElementById('chatArea');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message ' + (isUser ? 'user-msg' : 'avatar-msg');
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  msgDiv.appendChild(bubble);
  chatArea.appendChild(msgDiv);
  chatArea.scrollTop = chatArea.scrollHeight;
  return bubble;   // 返回气泡，方便把声音控件挂上去
}

function addTyping() {
  const chatArea = document.getElementById('chatArea');
  const msgDiv = document.createElement('div');
  msgDiv.className = 'message avatar-msg';
  msgDiv.id = 'typingMsg';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  msgDiv.appendChild(bubble);
  chatArea.appendChild(msgDiv);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

function getVoiceControl(bubble) {
  if (!bubble) return null;
  let ctl = bubble.querySelector('.voice-ctl');
  if (!ctl) {
    ctl = document.createElement('div');
    ctl.className = 'voice-ctl';
    ctl.textContent = '🔊 声音生成中…';
    bubble.appendChild(ctl);
    const chatArea = document.getElementById('chatArea');
    chatArea.scrollTop = chatArea.scrollHeight;
  }
  return ctl;
}

// ---------- 文字与语音同步（念到哪亮到哪） ----------
const SYNC = { raf: null, chars: null, cur: -1, t0: 0, dur: 0 };

// 把整段回答拆成一个个字，方便逐个点亮
function prepareSync(bubble, text) {
  if (!bubble) return null;
  clearSync();
  bubble.textContent = '';
  const wrap = document.createElement('span');
  wrap.className = 'sync-text';
  const chars = [];
  const list = Array.from(text);
  for (let i = 0; i < list.length; i++) {
    const s = document.createElement('span');
    s.className = 'ch';
    s.textContent = list[i];
    wrap.appendChild(s);
    chars.push(s);
  }
  bubble.appendChild(wrap);
  return chars;
}

// 播放开始时调用：按音频总时长把文字均匀铺开，念到哪亮到哪
function startSync(chars, duration) {
  clearSync();
  if (!chars || !chars.length || !duration || duration <= 0) return;
  const total = chars.length;
  SYNC.chars = chars;
  SYNC.dur = duration;
  SYNC.t0 = performance.now();
  SYNC.cur = -1;

  function tick() {
    const elapsed = (performance.now() - SYNC.t0) / 1000;
    const progress = Math.min(1, elapsed / SYNC.dur);
    const idx = Math.min(total - 1, Math.floor(progress * total));
    if (idx !== SYNC.cur) {
      if (SYNC.cur >= 0 && chars[SYNC.cur]) {
        chars[SYNC.cur].classList.remove('current');
        chars[SYNC.cur].classList.add('spoken');
      }
      chars[idx].classList.add('current');
      SYNC.cur = idx;
      keepInView();
    }
    SYNC.raf = requestAnimationFrame(tick);
  }
  SYNC.raf = requestAnimationFrame(tick);
}

function clearSync() {
  if (SYNC.raf) { cancelAnimationFrame(SYNC.raf); SYNC.raf = null; }
  if (SYNC.chars && SYNC.cur >= 0 && SYNC.chars[SYNC.cur]) {
    SYNC.chars[SYNC.cur].classList.remove('current');
  }
  SYNC.chars = null;
  SYNC.cur = -1;
}

// 跟随朗读自动滚动，但用户自己往上翻看时就不打扰
function keepInView() {
  const area = document.getElementById('chatArea');
  if (!area) return;
  const nearBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 100;
  if (nearBottom) area.scrollTop = area.scrollHeight;
}

function finishPlayback(ctl, token) {
  if (token !== AUDIO.token) return;
  AUDIO.playing = false;
  AUDIO.src = null;
  AUDIO.elActive = false;
  clearSync();
  setSpeaking(false);
  stopBars();
  // 播完就把状态文字收掉，不留一个看着像按钮、其实点不动的残影
  if (ctl && ctl.parentNode) ctl.parentNode.removeChild(ctl);
}

// ---------- 自动播放被系统拦截时的"静默补播" ----------
// 不再弹"点我播放"按钮。改为把这条内容记下来，
// 用户下一次点击/触摸/按键时自动补播一次。
// 这样体验上就是"文字和声音默认同步播放"，不需要用户去点任何播放键。
const PENDING_PLAY = { text: '', bubble: null, armed: false };

function armAutoRetry(text, bubble) {
  PENDING_PLAY.text = text;
  PENDING_PLAY.bubble = bubble;
  if (PENDING_PLAY.armed) return;
  PENDING_PLAY.armed = true;
  const once = function () {
    document.removeEventListener('click', once, true);
    document.removeEventListener('touchend', once, true);
    document.removeEventListener('keydown', once, true);
    PENDING_PLAY.armed = false;
    const t = PENDING_PLAY.text;
    const b = PENDING_PLAY.bubble;
    PENDING_PLAY.text = '';
    PENDING_PLAY.bubble = null;
    if (t) playVoice(t, b);
  };
  document.addEventListener('click', once, true);
  document.addEventListener('touchend', once, true);
  document.addEventListener('keydown', once, true);
}

// ---------- 合成 + 自动播放 ----------
async function playVoice(text, bubble) {
  const token = ++AUDIO.token;
  const chars = prepareSync(bubble, text);              // 先拆成可点亮的字
  const ctl = bubble ? getVoiceControl(bubble) : null;  // 再挂控件（顺序不能反，会被清掉）
  if (ctl) { ctl.className = 'voice-ctl'; ctl.textContent = '🔊 声音生成中…'; }
  setSpeaking(true, '正在用他的声音回答…');

  try {
    const resp = await fetch('/api/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    if (token !== AUDIO.token) return;              // 已被更新的消息取代

    if (data.engine && data.engine !== 'doubao_clone' && data.engine !== 'cache') {
      console.warn('[数字分身] 本次没有用上克隆音色，engine =', data.engine);
    }

    // ===== 路线 A：Web Audio，移动端成功率最高，还能驱动口型条 =====
    if (AUDIO.ctx) {
      try {
        if (AUDIO.ctx.state !== 'running') await AUDIO.ctx.resume();
        const arr = await (await fetch(data.audio_url)).arrayBuffer();
        const buffer = await decodeAudioBuffer(arr);
        if (token !== AUDIO.token) return;

        stopPlayback();
        const src = AUDIO.ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(AUDIO.analyser);
        src.onended = function () { finishPlayback(ctl, token); };
        src.start(0);

        AUDIO.src = src;
        AUDIO.playing = true;
        startSync(chars, buffer.duration);   // 文字跟着声音走
        startBars(true);
        if (ctl) { ctl.className = 'voice-ctl'; ctl.textContent = '🔊 正在播放…'; }
        return;
      } catch (e) {
        console.warn('[数字分身] Web Audio 播放失败，改用 <audio> 元素：', e);
      }
    }

    // ===== 路线 B：常驻 <audio> 元素 =====
    const el = getAudioEl();
    if (!el) throw new Error('页面缺少音频元素');

    stopPlayback();
    el.volume = 1;
    el.src = data.audio_url;
    AUDIO.elActive = true;
    AUDIO.playing = true;
    el.onended = function () { finishPlayback(ctl, token); };
    el.onerror = function () { finishPlayback(ctl, token); };
    await el.play();

    if (token !== AUDIO.token) return;
    let d = el.duration;
    if (!isFinite(d) || d <= 0) d = Math.max(2, text.length / 4.5);  // 拿不到时长就按字数估
    startSync(chars, d);
    startBars(false);
    if (ctl) { ctl.className = 'voice-ctl'; ctl.textContent = '🔊 正在播放…'; }

  } catch (err) {
    console.warn('[数字分身] 自动播放被系统拦截或失败：', err);
    if (token !== AUDIO.token) return;
    AUDIO.playing = false;
    setSpeaking(false);
    stopBars();
    // 不再出现"点我播放他的声音"按钮：
    // 只留一句很淡的状态提示，用户随手点一下页面就会自动补播。
    if (ctl) {
      ctl.className = 'voice-ctl';
      ctl.textContent = '🔇 浏览器拦截了自动播放，点页面任意位置继续';
    }
    armAutoRetry(text, bubble);
  }
}

// ---------- 发送消息 ----------
async function sendMessage() {
  unlockAudio();                      // 关键：在"点发送"这个手势里先把音频通道点亮

  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, true);
  input.value = '';
  if (sendBtn) sendBtn.disabled = true;
  addTyping();

  try {
    // 1. 取AI回答
    const chatResp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: text, session_id: 'default' })
    });
    const chatData = await chatResp.json();
    if (chatData.error) throw new Error(chatData.error);

    removeTyping();
    const bubble = addMessage(chatData.answer, false);

    // 2. 立刻合成并自动播放（不用再点任何按钮）
    playVoice(chatData.answer, bubble);

  } catch (err) {
    removeTyping();
    addMessage('抱歉，出错了：' + err.message, false);
  }

  if (sendBtn) sendBtn.disabled = false;
}

function askQuestion(text) {
  unlockAudio();
  const input = document.getElementById('userInput');
  if (input) input.value = text;
  sendMessage();
}

// ============================================================
// 荣誉证书：点一下铺满屏幕看大图
// 纯展示功能，不和音频/聊天共用任何状态；任何一步失败都只是点不开，
// 不会影响语音和对话。
// ============================================================
function openHonorZoom(src, alt) {
  const box = document.getElementById('honorLightbox');
  const img = document.getElementById('honorLightboxImg');
  if (!box || !img || !src) return;
  // 传进来的已经是 lg/ 大图地址；先显示小图再换成大图会闪，
  // 所以这里直接给大图，同时靠 hover 预取把等待压到看不见。
  img.src = src;
  img.alt = alt || '';
  box.classList.add('open');
}

function closeHonorZoom() {
  const box = document.getElementById('honorLightbox');
  if (box) box.classList.remove('open');
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' || e.key === 'Esc') closeHonorZoom();
});

// 给 10 张荣誉卡都挂上点击；用循环 + 判断，缺元素也不会报错
// 卡片显示的是缩略图，点开取 data-full 的大图；鼠标移上去就先悄悄预取大图，
// 这样点开是"秒出"，不会白屏等下载。
// 另外留了一条老浏览器兜底：万一不认识 webp，就退回原来的 png/jpg。
(function bindHonorZoom() {
  const FALLBACK = {};
  const prefetched = {};
  function prefetch(url) {
    if (!url || prefetched[url]) return;
    prefetched[url] = true;
    const im = new Image();
    im.src = url;
  }
  const cards = document.querySelectorAll('.honor-card');
  for (let i = 0; i < cards.length; i++) {
    const card = cards[i];
    if (!card.getAttribute('data-full')) card.setAttribute('data-full', card.getAttribute('src'));
    card.addEventListener('click', function (e) {
      e.stopPropagation();
      openHonorZoom(this.getAttribute('data-full'), this.getAttribute('alt'));
    });
    card.addEventListener('pointerenter', function () { prefetch(this.getAttribute('data-full')); });
    card.addEventListener('touchstart', function () { prefetch(this.getAttribute('data-full')); }, { passive: true });
    card.addEventListener('error', function () {
      // th/xxx.webp 取不到（极老的浏览器），退回原始图片，宁可慢也不能空着
      const m = (this.getAttribute('src') || '').match(/([^/]+)\.webp$/);
      const fb = m && FALLBACK[m[1]];
      if (fb && this.src.indexOf(fb) === -1) this.src = fb;
    }, true);
  }
})();

// 初始化
</script>

<!-- 荣誉证书点开看大图 -->
<div id="honorLightbox" onclick="closeHonorZoom()">
  <img id="honorLightboxImg" src="" alt="">
  <div class="lb-hint">点击任意处关闭</div>
</div>
